name: HK Stock Strategy Tracker

on:
  workflow_dispatch:  # 手動點擊時直接執行全套
  schedule:
    # 盤後 16:10 執行全套 (UTC 08:10)
    - cron: '10 8 * * 1-5'

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Execute Strategy Script
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python fetch_stock.py
