name: Stock Stock Reminder Bot

on:
  schedule:
    # 這裡的 Cron 使用 UTC 時間 (台北時間減 8 小時)
    # 範例：週一至週五的 UTC 01:00 ~ 05:00 (台北 09:00 ~ 13:00)，每小時整點觸發一次
    - cron: '0 1-5 * * 1-5'
  workflow_dispatch: # 允許手動點擊按鈕測試

jobs:
  run-strategy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/configure-pages@v5 # 或是直接使用標準 python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Stock Bot
      env:
        # 將 GitHub Secrets 帶入環境變數中供 Python 讀取
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python fetch_stock.py
