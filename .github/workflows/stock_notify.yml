name: Taiwan Stock Advanced Strategies Bot

on:
  schedule:
    # 1. 盤中策略：週一至週五 台北時間 09:05, 11:05, 13:05 (對應 UTC 01:05, 03:05, 05:05)
    - cron: '5 1,3,5 * * 1-5'
    
    # 2. 盤後籌碼：週一至週五 台北時間 17:00 (對應 UTC 09:00)
    - cron: '0 9 * * 1-5'
    
    # 3. 基本面篩選：每週六 台北時間 10:00 (對應 UTC 02:00)
    - cron: '0 2 * * 6'
    
  workflow_dispatch: # 保持手動測試功能

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 確保這裡全部使用小寫的 finmind
        pip install requests pandas finmind

    # 執行策略 1：盤中突破
    - name: Run Intraday Strategy
      if: github.event.schedule == '5 1,3,5 * * 1-5' || github.event_name == 'workflow_dispatch'
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python fetch_stock.py strategy_1

    # 執行策略 2：盤後籌碼
    - name: Run After-Hours Strategy
      if: github.event.schedule == '0 9 * * 1-5'
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python fetch_stock.py strategy_2

    # 執行策略 3：基本面篩選
    - name: Run Fundamental Strategy
      if: github.event.schedule == '0 2 * * 6'
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python fetch_stock.py strategy_3
