name: HK Stock Strategy Tracker

on:
  workflow_dispatch:
    inputs:
      strategy_choice:
        description: '選擇執行的策略'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - strategy_1
          - strategy_2
          - strategy_3
          - strategy_4
          - strategy_5
          - strategy_6
          - strategy_7
          - strategy_8
  schedule:
    # UTC 時間：盤後 16:10 執行全套 (UTC 08:10)
    - cron: '10 8 * * 1-5'

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Determine Run Command
        id: set-cmd
        run: |
          CMD="python fetch_stock.py all"
          
          EVENT_NAME="${{ github.event_name }}"
          CHOICE="${{ github.event.inputs.strategy_choice }}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CMD="python fetch_stock.py $CHOICE"
          fi

          echo "run_cmd=$CMD" >> $GITHUB_OUTPUT

      - name: Execute Strategy Script
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          ${{ steps.set-cmd.outputs.run_cmd }}
